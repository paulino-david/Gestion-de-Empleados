<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- My metadatas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/index.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="div_f">
        <div class="designe_img"></div>

        <form class="formulario">

          <a href="./empleados.html" class="topForm">
            <i class="fa-solid fa-bars burger"></i>
          </a>

          <div>
            <h2>Bienvenido 👋😜</h2>
            <h3>Añade un nuevo empleado</h3>
          </div>
          <div class="inputs">
            <div class="input">
              <input type="text" id="nombre" placeholder="Nombre" />
            </div>

            <div class="input">
              <input
                type="number"
                min="0"
                step="0.1"
                id="salario"
                placeholder="Salario"
              />
              <p>$</p>
            </div>

            <div class="input">
              <input type="text" id="departamento" placeholder="Departamento" />
              <p><i class="fa-solid fa-building-user icono"></i></p>
            </div>
          </div>
          <div class="error" id="error"></div>
          <div class="btn">
            <button type="button" id="crear">Crear</button>
          </div>
        </form>
      </div>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
